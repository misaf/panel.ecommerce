# /opt/apps/vendra/docker-compose.traefik.yml
# Production OVERLAY over the vendra repo's docker/docker-compose.yml. Deploy with:
#
#   docker compose \
#     -f /path/to/vendra/docker/docker-compose.yml \
#     -f docker-compose.traefik.yml \
#     --env-file .env up -d
#
# It (1) stops the app publishing 80/443, (2) serves plain HTTP on :8080 behind
# Traefik, (3) joins the shared traefik-public network, and (4) declares TWO
# backend services — panels and API — from the same image.
#
# ROUTERS ARE NOT HERE. The five platform hostnames live in
# proxy/traefik/dynamic/vendra.yml and reference these services as
# `vendra-api@docker` / `vendra-panels@docker`. Labels below declare only the
# service (port + health check), which is the part that must be discovered
# per-replica so `--scale` works.
name: vendra

# Cap container logs — an unrotated json-file log fills a single host's disk
# faster than anything else here.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Shared by both PHP backends. APP_URL must be the BASE host: the admin
# middleware derives the admin domain as `admin.<host>`, and the console/reseller
# panels bind `console.<host>` / `reseller.<host>` from this host. Setting it to
# admin.<base> would nest them as console.admin.<base> (→ 404).
x-app-environment: &app-environment
  APP_URL: "https://${BASE_DOMAIN}"

services:
  # --- Panels: admin, <slug>.admin, console, reseller -------------------------
  php:
    # Drop the public ports — Traefik is the only internet-facing container.
    # `!override` replaces the base list instead of appending to it.
    ports: !override []
    expose:
      - "8080"
    environment: *app-environment
    # No Caddyfile mount: the image's docker/Caddyfile already serves plain HTTP
    # on :8080 (vendra runs only behind a TLS-terminating proxy).
    networks:
      net: {}
      traefik-public:
        # Stable name on the edge network regardless of replica count.
        aliases: [vendra-php-panels]
    logging: *logging
    labels:
      - "traefik.enable=true"
      # php is multi-homed; tell Traefik which network to reach it on.
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.vendra-panels.loadbalancer.server.port=8080"
      # Without a health check Traefik routes to a container that is still
      # booting or already shutting down — every `compose up` becomes a visible
      # 502 window. With it, replicas drain and rolling restarts are safe.
      - "traefik.http.services.vendra-panels.loadbalancer.healthcheck.path=/up"
      - "traefik.http.services.vendra-panels.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.vendra-panels.loadbalancer.healthcheck.timeout=3s"

  # --- Canonical API ----------------------------------------------------------
  # Same image, separate container: a slow Filament report in the panels can no
  # longer starve storefront API traffic of PHP workers, and the API — the side
  # that grows with the property count — scales on its own:
  #
  #   docker compose … up -d --scale php-api=2 --no-recreate
  php-api:
    # Inherit build/env/healthcheck from the base `php` service so there is one
    # definition to maintain. NOTE the path: Compose resolves `extends.file`
    # against the PROJECT directory — the first `-f` file's dir, i.e. the repo's
    # docker/ — not against this file. Hence the bare name, not `../../docker/…`.
    extends:
      file: docker-compose.yml
      service: php
    # `extends` copies ports, and a bare `[]` merges to nothing — `!override` is
    # what actually clears the inherited 80/443 publish.
    ports: !override []
    expose:
      - "8080"
    # storage-data is shared on purpose (one app, one storage dir). The Caddy
    # data/config volumes are not: two FrankenPHP instances must not write the
    # same /data.
    volumes: !override
      - storage-data:/app/storage/app
      - caddy-api-data:/data
      - caddy-api-config:/config
    environment: *app-environment
    restart: unless-stopped
    depends_on:
      # `extends` deliberately does not copy depends_on — re-declare it.
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      net: {}
      traefik-public:
        aliases: [vendra-php-api]
    logging: *logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.vendra-api.loadbalancer.server.port=8080"
      - "traefik.http.services.vendra-api.loadbalancer.healthcheck.path=/up"
      - "traefik.http.services.vendra-api.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.vendra-api.loadbalancer.healthcheck.timeout=3s"

  # --- Datastores and workers: private network only ---------------------------
  # Keep MySQL reachable only through the host loopback interface so database
  # clients can connect safely through an SSH tunnel. It is not public.
  mysql:
    ports: !override
      - "127.0.0.1:3306:3306"
    logging: *logging

  # Mailpit remains private to the Docker network in production.
  mailpit:
    ports: !override []
    logging: *logging

  redis:
    logging: *logging

  horizon:
    logging: *logging

  scheduler:
    logging: *logging

  pulse:
    logging: *logging

  pulse-worker:
    logging: *logging

  provisioner:
    logging: *logging

volumes:
  caddy-api-data:
  caddy-api-config:

networks:
  traefik-public:
    external: true
