# /opt/apps/proxy/docker-compose.yml
# The ONLY container on the host that publishes 80/443. Everything else is
# discovered over the shared `traefik-public` network.
#
# One-time host setup:
#   docker network create traefik-public
#   touch proxy/traefik/acme/acme.json && chmod 600 proxy/traefik/acme/acme.json
name: proxy

# Cap container logs. On a single host an unrotated json-file log is the fastest
# way to fill the disk and take the whole stack down with it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Traefik never touches the Docker socket directly. READ access to the socket
  # exposes every container's environment — i.e. every secret in every .env — so
  # a `:ro` mount is not a security boundary. This proxy forwards only the
  # read-only endpoints Traefik's provider actually calls.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1 # provider: list/inspect containers
      NETWORKS: 1 # provider: resolve container IPs
      SERVICES: 1 # swarm provider (harmless on plain docker)
      TASKS: 1 # swarm provider
      EVENTS: 1 # provider: watch=true needs the event stream
      # Everything else stays denied, in particular:
      POST: 0 # no writes of any kind
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      INFO: 0
      SECRETS: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2375 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      socket-proxy:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      # - "443:443/udp"   # enable with HTTP/3
    environment:
      # The platform routers live in dynamic/vendra.yml, which Traefik
      # renders INSIDE this container — compose-level interpolation cannot reach
      # it, so the base domain has to be a real env var here.
      BASE_DOMAIN: "${BASE_DOMAIN:?BASE_DOMAIN is required (see .env.example)}"
      # Certificate resolver for the platform hosts. Empty locally (mkcert
      # default cert); `letsencrypt-dns` in production, where ONE wildcard cert
      # covers <base>, *.<base> and *.admin.<base>.
      CERT_RESOLVER_DNS: "${CERT_RESOLVER_DNS:-}"
      # HTTP-01 resolver, for admin.<customer-domain> — those domains belong to
      # the customer, so the DNS-01 wildcard cannot cover them.
      CERT_RESOLVER: "${CERT_RESOLVER:-}"
      # DNS-01 provider credential (Cloudflare shown). Leave unset in local dev.
      # Keep this in the .env, never commit the real token.
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN:-}"
    volumes:
      # NOTE: no docker.sock mount here, by design — see socket-proxy above.
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme:/acme # acme.json (prod, chmod 600)
      - ./traefik/certs:/certs:ro # mkcert certs (local dev)
    networks:
      - traefik-public
      - socket
    logging: *logging
    labels:
      - "traefik.enable=true"
      # Dashboard: https://traefik.${BASE_DOMAIN}, TLS + basic auth.
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=${CERT_RESOLVER_DNS:-}"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@file,security-headers@file"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  # Shared, external, created once by hand. Frontend edge only — no datastore
  # ever joins this network.
  traefik-public:
    external: true
  # Traefik ↔ socket-proxy only. `internal: true` = no route off the host.
  socket:
    internal: true
