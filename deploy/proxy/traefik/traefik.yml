# Traefik v3 static configuration.
# This file is mounted read-only into the proxy container. Traefik does NOT
# interpolate ${ENV} here — values that vary per environment (ACME email, DNS
# token) are set literally below or passed as TRAEFIK_* / provider env vars in
# docker-compose.yml. Routers, services and certresolver *selection* live on
# container labels (see each app's compose), so this file rarely changes.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Two public entrypoints. `web` (:80) permanently redirects everything to
# `websecure` (:443); no application ever listens on 80 in the clear.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
    # Uncomment to advertise HTTP/3 (also publish 443/udp in compose):
    # http3: {}

# Dashboard/API. insecure:false means it is reachable ONLY through the labelled,
# TLS + basic-auth router defined on the proxy service — never on a raw port.
api:
  dashboard: true
  insecure: false

# Auto-discovery: containers opt in with `traefik.enable=true`. Only containers
# on the shared traefik-public network are considered.
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik-public
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Certificate resolvers.
#   letsencrypt      — HTTP-01, one cert per exact hostname (storefront apexes,
#                      admin/console/reseller/api). Selected in prod via the
#                      CERT_RESOLVER compose var.
#   letsencrypt-dns  — DNS-01, the only challenge that can mint the
#                      *.admin.<base> wildcard for dynamic per-tenant admin
#                      subdomains. Needs a DNS-provider token (see compose).
# In LOCAL dev both are simply unreferenced: routers leave certresolver empty
# and fall back to the mkcert default certificate from dynamic/tls-local.yml.
certificatesResolvers:
  letsencrypt:
    acme:
      email: "change-me@example.com" # <-- set to your ops email before prod
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web
  letsencrypt-dns:
    acme:
      email: "change-me@example.com" # <-- same email
      storage: /acme/acme.json
      dnsChallenge:
        provider: cloudflare # swap for your DNS provider; token via env in compose
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

log:
  level: INFO

# JSON access logs → picked up by the Docker json-file driver / shipped to Loki.
accessLog:
  format: json
  fields:
    headers:
      names:
        User-Agent: keep

# Prometheus metrics for the monitoring stack.
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

ping: {}
