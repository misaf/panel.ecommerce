# Traefik v3 static configuration.
# This file is mounted read-only into the proxy container. Traefik does NOT
# interpolate ${ENV} here — values that vary per environment (ACME email, DNS
# token) are set literally below or passed as TRAEFIK_* / provider env vars in
# docker-compose.yml.
#
# The five PLATFORM routers (admin, <slug>.admin, console, reseller, api) live in
# dynamic/vendra.yml — they are static hostnames pointing at static
# services, so they belong in a reviewable, git-diffable file rather than in a
# 45-line label block that is rebuilt with the app container. Container labels
# are reserved for the genuinely dynamic case: storefront properties, which come
# and go without a proxy edit.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Two public entrypoints. `web` (:80) permanently redirects everything to
# `websecure` (:443); no application ever listens on 80 in the clear.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
    # Uncomment to advertise HTTP/3 (also publish 443/udp in compose):
    # http3: {}

# Dashboard/API. insecure:false means it is reachable ONLY through the labelled,
# TLS + basic-auth router defined on the proxy service — never on a raw port.
api:
  dashboard: true
  insecure: false

# Auto-discovery: containers opt in with `traefik.enable=true`. Only containers
# on the shared traefik-public network are considered.
providers:
  docker:
    # Not the raw socket: a read-only socket-proxy sidecar (see compose). Read
    # access to the real socket would expose every container's environment.
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: traefik-public
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true
    # Every dynamic file here is rendered as a Go template first, which is how
    # vendra.yml reaches `{{ env "BASE_DOMAIN" }}`. A `.tmpl` extension does NOT
    # work — the provider skips unrecognised extensions, so keep the `.yml`.

# Certificate resolvers. Which one a host uses follows from who controls its DNS:
#
#   letsencrypt-dns  — DNS-01, used by EVERY platform host. One wildcard cert
#                      (<base> + *.<base> + *.admin.<base>) covers apex, admin,
#                      <slug>.admin, console, reseller and api together. One
#                      issuance path instead of five, it keeps working when :80
#                      is filtered, and it is the only challenge that can mint
#                      the *.admin wildcard the dynamic tenant subdomains need.
#   letsencrypt      — HTTP-01, used ONLY by storefront properties. Their DNS
#                      belongs to the customer, so DNS-01 is not available there;
#                      HTTP-01 needs nothing but an A record pointed at this host.
#
# In LOCAL dev both are simply unreferenced: routers leave certresolver empty
# and fall back to the mkcert default certificate from dynamic/tls-local.yml.
certificatesResolvers:
  letsencrypt:
    acme:
      email: "change-me@example.com" # <-- set to your ops email before prod
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web
  letsencrypt-dns:
    acme:
      email: "change-me@example.com" # <-- same email
      storage: /acme/acme.json
      dnsChallenge:
        provider: cloudflare # swap for your DNS provider; token via env in compose
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

log:
  level: INFO

# JSON access logs → picked up by the Docker json-file driver / shipped to Loki.
#
# X-Request-ID is the correlation key: App\Http\Middleware\AddRequestContext
# accepts an inbound one (UUID-validated), puts it in the Laravel log context,
# and echoes it on the response. Keeping it here joins an edge log line to its
# application log line — and to any job that request dispatched — on one id.
accessLog:
  format: json
  fields:
    headers:
      names:
        User-Agent: keep
        X-Request-ID: keep

# Prometheus metrics. Nothing scrapes these by default — point your Prometheus
# at the Traefik container's :8080/metrics (or enable a dedicated metrics
# entrypoint) to make them useful.
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

# Distributed tracing. Traefik v3 speaks OTLP natively; uncomment and point it
# at your collector to get edge spans that carry the same request id as the
# application logs above.
# tracing:
#   otlp:
#     http:
#       endpoint: "http://otel-collector:4318/v1/traces"

ping: {}
