# LOCAL DEVELOPMENT ONLY.
# Public CAs (Let's Encrypt) cannot issue for `.test`, so in dev we hand Traefik
# a locally-trusted certificate from mkcert and make it the DEFAULT store.
# Routers that leave `certresolver` empty (CERT_RESOLVER unset) serve this cert.
#
# Generate once on the host (mkcert must be installed and its root CA trusted):
#   mkcert -install
#   mkcert -cert-file proxy/traefik/certs/local.pem \
#          -key-file  proxy/traefik/certs/local-key.pem \
#          "vendra.test" "*.vendra.test" "*.admin.vendra.test" \
#          <your-client-domains…>
# (Or let stack.sh self-sign: it regenerates this cert to cover each client
#  domain as you add one with `stack.sh client add`.)
#
# In PRODUCTION this file is harmless (the certs/ dir is empty and no router
# relies on the default store); real certs come from the ACME resolvers.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/local.pem
        keyFile: /certs/local-key.pem
