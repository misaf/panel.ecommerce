{{ $base := env "BASE_DOMAIN" }}
{{ $baseRegex := replace "." "\\." $base }}
{{ $resolver := env "CERT_RESOLVER_DNS" }}
{{ $httpResolver := env "CERT_RESOLVER" }}
# The five PLATFORM routers. The file provider renders every dynamic file as a
# Go template first, so the `env` lookups above reach the values set on the
# Traefik container in proxy/docker-compose.yml. Keep the `.yml` extension — the
# provider skips files whose extension it does not recognise, `.tmpl` included.
#
# These hosts are static, so they live here instead of in a 45-line label block:
# reviewable in git, and they survive a recreate of the app container.
# Storefront properties stay on labels — they are the genuinely dynamic case.
#
# The BACKENDS are still discovered by the docker provider (`@docker` below), so
# Traefik sees each replica individually and `--scale php-api=N` works. Only the
# routing moved. Port and health check for those services are declared as labels
# in vendra/docker-compose.traefik.yml.
#
# All of them use the ONE wildcard certificate (<base> + *.<base> +
# *.admin.<base>) issued via DNS-01, so adding a platform host costs no extra
# ACME issuance. Locally CERT_RESOLVER_DNS is empty and the mkcert default cert
# from tls-local.yml is served instead.
http:
  routers:
    # --- Canonical API (the ONLY API endpoint) ------------------------------
    vendra-api:
      rule: "Host(`api.{{ $base }}`)"
      entryPoints: [websecure]
      service: "vendra-api@docker"
      middlewares:
        - security-headers@file
        - rate-limit-api@file
        - compression@file
      tls:
        {{- if $resolver }}
        certResolver: "{{ $resolver }}"
        domains:
          - main: "{{ $base }}"
            sans:
              - "*.{{ $base }}"
              - "*.admin.{{ $base }}"
        {{- end }}

    # --- Tenant admin, canonical hosts --------------------------------------
    # ONE router, because there is ONE admin panel. `admin.<base>` and
    # `<slug>.admin.<base>` are two host shapes for the same tenant-scoped
    # panel (AdminPanelServiceProvider sets no ->domain(); the tenant comes from
    # the host via DomainTenantFinder). Splitting them into `admin` and
    # `tenant-admin` routers implied two panels that do not exist.
    #
    # The bare `admin.<base>` resolves no tenant and 404s from the app — routed
    # deliberately so that 404 comes from Laravel, not from a missing route.
    #
    # Both are covered by the *.admin.<base> SAN on the wildcard cert above.
    # Higher priority than the custom-domain router below so the canonical hosts
    # always take the DNS-01 wildcard rather than the HTTP-01 resolver.
    vendra-tenant-admin:
      rule: 'Host(`admin.{{ $base }}`) || HostRegexp(`^[a-z0-9-]+\.admin\.{{ $baseRegex }}$`)'
      priority: 100
      entryPoints: [websecure]
      service: "vendra-panels@docker"
      middlewares: [security-headers@file, rate-limit@file, compression@file]
      tls:
        {{- if $resolver }}
        certResolver: "{{ $resolver }}"
        {{- end }}

    # --- Tenant admin on a CUSTOM property domain ---------------------------
    # `admin.<customer-domain>` is a first-class host: DomainTenantFinder
    # resolves it (findForAdminHost strips the `admin.` prefix) and
    # AdminDomainTest covers it. It had no route at the edge at all, so the app
    # supported a host the proxy never delivered.
    #
    # It lives here rather than in property-template/ so a property's compose
    # file keeps referencing no other project. HTTP-01, not the wildcard: these
    # domains belong to the customer, so DNS-01 is unavailable.
    vendra-tenant-admin-custom:
      rule: 'HostRegexp(`^admin\..+$`)'
      priority: 10
      entryPoints: [websecure]
      service: "vendra-panels@docker"
      middlewares: [security-headers@file, rate-limit@file, compression@file]
      tls:
        {{- if $httpResolver }}
        certResolver: "{{ $httpResolver }}"
        {{- end }}

    # --- Console (platform owner/operator) ----------------------------------
    vendra-console:
      rule: "Host(`console.{{ $base }}`)"
      entryPoints: [websecure]
      service: "vendra-panels@docker"
      middlewares: [security-headers@file, rate-limit@file, compression@file]
      tls:
        {{- if $resolver }}
        certResolver: "{{ $resolver }}"
        {{- end }}

    # --- Reseller -----------------------------------------------------------
    vendra-reseller:
      rule: "Host(`reseller.{{ $base }}`)"
      entryPoints: [websecure]
      service: "vendra-panels@docker"
      middlewares: [security-headers@file, rate-limit@file, compression@file]
      tls:
        {{- if $resolver }}
        certResolver: "{{ $resolver }}"
        {{- end }}
