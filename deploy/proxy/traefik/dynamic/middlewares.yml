# Dynamic configuration (hot-reloaded, no restart). Reusable middlewares that
# apps attach by name via labels, e.g.
#   traefik.http.routers.<r>.middlewares=security-headers@file,rate-limit@file
http:
  middlewares:
    # Sensible security response headers for every public router.
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        customFrameOptionsValue: "SAMEORIGIN"

    # Coarse per-source shield for the panels. This is a blunt DoS guard, not a
    # fairness mechanism — it only knows a source address, never a caller.
    #
    # sourceCriterion decides what "per-source" means. The default (below) keys
    # on the real client IP, which is correct while Traefik is the edge. Behind a
    # CDN every request arrives from a handful of CDN egress IPs, so the default
    # would throttle whole regions together: set ipStrategy.depth to the number
    # of proxies in front of Traefik so it reads the right X-Forwarded-For entry.
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 0 # 0 = remote address. Behind a CDN, set to 1 (or more).

    # The API gets its own budget so one busy storefront cannot consume the
    # panels' allowance — they are separate backends (see vendra.yml) and should
    # not share a rate-limit bucket either.
    #
    # NOTE: this is still per-IP, which is the wrong unit for a storefront fleet
    # — many browsers, one tenant. Per-tenant quota belongs in Laravel's
    # RateLimiter keyed by the caller's credential, and is deliberately deferred
    # until the per-storefront API token lands (there is no caller identity to
    # key on before then).
    rate-limit-api:
      rateLimit:
        average: 200
        burst: 400
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 0

    # gzip/deflate for text responses (Traefik has no brotli; app/CDN can add it).
    compression:
      compress: {}

    # Redirect www.<host> → apex.
    www-redirect:
      redirectRegex:
        regex: "^https://www\\.(.*)"
        replacement: "https://${1}"
        permanent: true

    # Basic-auth gate for the Traefik dashboard. Generate a hash with:
    #   htpasswd -nbB admin 'your-password'
    # then replace the value below (escape every $ as $$ ONLY inside compose
    # labels — here in a file provider a single $ is correct).
    dashboard-auth:
      basicAuth:
        users:
          - "admin:$2y$10$mCUKWEDYcWv7jA9PeLw51OjJVCtEJQaTVRTI2nqyAfcKEn.s6j4PS"
