# insecure: true serves the API and dashboard on their own entrypoint (:8080)
# without a router. It is not exposed by that alone — the compose file publishes
# :8080 on loopback only, so reaching it means being on the host or forwarding it
# over SSH. Do not add a public router for api@internal without authentication.
api: {dashboard: true, insecure: true}
ping: {}
entryPoints:
  # Plain HTTP exists for two reasons: the ACME HTTP challenge (which Traefik
  # answers on this entrypoint before any router runs) and redirecting everyone
  # else. Without the redirection a bare http:// host is a 404, not an upgrade.
  web:
    address: ":80"
    http:
      redirections:
        entryPoint: {to: websecure, scheme: https, permanent: true}
  websecure: {address: ":443"}
providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: traefik-public
  file:
    directory: /etc/traefik/dynamic
    watch: true
