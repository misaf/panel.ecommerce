name: vendra

# Six services mount the shared storage-data volume. Docker seeds a named volume
# from the image the first time it is mounted, and creating them concurrently
# races: one wins and the rest fail with "mkdir ...: file exists". Starting the
# others after php means the volume is already seeded by the time they mount it.
x-datastores: &datastores
  mysql: {condition: service_healthy}
  redis: {condition: service_healthy}
x-after-app: &after-app
  mysql: {condition: service_healthy}
  redis: {condition: service_healthy}
  php: {condition: service_started}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?required}"
      MYSQL_DATABASE: "${DB_DATABASE:-vendra}"
      MYSQL_USER: "${DB_USERNAME:-vendra}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?required}"
    volumes: ["mysql-data:/var/lib/mysql"]
    networks: [internal]
    # Loopback by default, which covers both ways people reach this database:
    # locally you connect from the same machine, and on a server an SSH tunnel
    # terminates on the host and dials its loopback. A bare "3306:3306" would
    # publish the database on every interface of a multi-tenant host.
    ports: ["${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    volumes: ["redis-data:/data"]
    networks: [internal]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 6}

  php: &php
    image: "${VENDRA_PLATFORM_IMAGE:?required}"
    restart: unless-stopped
    env_file: ["platform.env"]
    expose: ["8080"]
    volumes: ["storage-data:/app/storage/app"]
    networks: [internal, traefik-public]
    depends_on: *datastores
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.vendra-panels.loadbalancer.server.port=8080"

  php-api:
    <<: *php
    depends_on: *after-app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.vendra-api.loadbalancer.server.port=8080"

  horizon:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "horizon"]
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

  # Storefront provisioning, isolated from every other queued job.
  #
  # This is the only container in the estate holding a container-runtime socket.
  # Under Docker that socket is root-equivalent on the host; under rootless
  # Podman it is not, which is the reason to prefer it. Horizon's supervisor
  # deliberately does not list the "storefronts" queue, so provisioning runs here
  # and nothing else does. Widening this container's queues, or handing the
  # socket to Horizon, gives every job in the system that access.
  storefront-worker:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "queue:work", "--queue=storefronts", "--tries=5", "--timeout=180"]
    volumes:
      - "storage-data:/app/storage/app"
      # Whatever the host socket is, it is always mounted at the Docker path, so
      # the CONTAINER_ENDPOINT bin/vendra writes into platform.env is the same on
      # either runtime. CONTAINER_RUNTIME there selects the adapter.
      - "${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

  scheduler:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "schedule:work"]
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

  # Server metrics (CPU, memory, storage). Without this the Pulse dashboard
  # renders but its server cards stay empty.
  pulse:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "pulse:check"]
    # Stable hostname so stats record under one name across container
    # replacements instead of fragmenting across random container IDs.
    hostname: "vendra-app"
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

  # Drains the Redis ingest buffer into storage. Required whenever
  # PULSE_INGEST_DRIVER=redis — without it, entries buffer and never land, and
  # the dashboard goes silently empty.
  pulse-worker:
    <<: *php
    depends_on: *after-app
    command: ["php", "artisan", "pulse:work"]
    networks: [internal]
    labels: []
    healthcheck: {disable: true}

volumes:
  mysql-data: {}
  redis-data: {}
  storage-data: {}

networks:
  internal: {}
  traefik-public: {external: true}
