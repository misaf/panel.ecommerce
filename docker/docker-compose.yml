name: "${APP_NAME:-vendra}"

# Docker-specific overrides — these win over root .env values.
# Most Laravel env vars come from the root .env via env_file below.
x-php-environment: &php-environment
  APP_KEY: "${APP_KEY:-}"
  DB_HOST: "${DB_HOST:-mysql}"
  DB_DATABASE: "${DB_DATABASE:-vendra}"
  DB_USERNAME: "${DB_USERNAME:-vendra}"
  DB_PASSWORD: "${DB_PASSWORD:-change-this-db-password}"
  REDIS_HOST: "${REDIS_HOST:-redis}"
  SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
  QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
  CACHE_STORE: "${CACHE_STORE:-redis}"
  MAIL_MAILER: "${MAIL_MAILER:-smtp}"
  MAIL_HOST: "${MAIL_HOST:-mailpit}"
  MAIL_PORT: "${MAIL_PORT:-1025}"
  MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-null}"
  TZ: "${TIMEZONE:-UTC}"

x-php-service: &php-service
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: app
    args:
      ALPINE_MIRROR: "${ALPINE_MIRROR:-https://mirror.mobinhost.com/alpine}"
  env_file: ../.env
  environment: *php-environment
  volumes:
    - storage-data:/app/storage/app
  networks:
    - net

x-laravel-worker: &laravel-worker
  <<: *php-service
  restart: unless-stopped
  # The base image healthcheck probes the Caddy admin endpoint, which only
  # exists in the web container; workers are plain artisan processes whose
  # liveness is their PID 1.
  healthcheck:
    disable: true
  depends_on:
    mysql:
      condition: service_healthy
    php:
      condition: service_healthy

x-redis-worker: &redis-worker
  <<: *laravel-worker
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    php:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: "${TIMEZONE:-UTC}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-change-this-db-root-password}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE:-vendra}"
      MYSQL_USER: "${DB_USERNAME:-vendra}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-change-this-db-password}"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - net
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  php:
    <<: *php-service
    restart: unless-stopped
    volumes:
      - storage-data:/app/storage/app
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO /dev/null http://127.0.0.1:8080/up"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - redis-data:/data
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  horizon:
    <<: *redis-worker
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "php artisan horizon:status --no-ansi | grep -q 'is running'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  scheduler:
    <<: *laravel-worker
    command: ["php", "artisan", "schedule:work"]

  pulse:
    <<: *laravel-worker
    command: ["php", "artisan", "pulse:check"]
    # Stable hostname so Pulse records server stats under one name across
    # container replacements instead of a new random container ID each time.
    hostname: "${APP_NAME:-vendra}-app"

  pulse-worker:
    <<: *redis-worker
    command: ["php", "artisan", "pulse:work"]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - mailpit-data:/data
    networks:
      - net
    ports:
      - "${MAILPIT_UI_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  storage-data:
  caddy-data:
  caddy-config:
  mysql-data:
  redis-data:
  mailpit-data:

networks:
  net:
