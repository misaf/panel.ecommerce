name: Claude Issue Solver

on:
  issues:
    types: [labeled]

jobs:
  solve:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer install --prefer-dist --no-interaction --no-progress

      - name: Claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            Solve GitHub issue #${{ github.event.issue.number }}.

            Read the issue and inspect the repository.

            If it is a bug or implementation task:
            - Find the root cause.
            - Implement the smallest correct fix.
            - Add or update tests when appropriate.
            - Run the relevant tests.
            - Do not change unrelated code.
            - Create a pull request referencing the issue.

            If it is only a question:
            - Investigate the repository.
            - Answer the issue without changing code.

            Never push directly to the 1.x branch.

          claude_args: |
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(composer:*),Bash(php:*),Bash(vendor/bin/pest:*),Bash(vendor/bin/phpstan:*),Bash(vendor/bin/pint:*),Read,Edit,Write"
